<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAOS SUPER OMOK LOBBY</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  body { background: #05070a; color: #e2e8f0; font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  .header { margin-top: 40px; text-align: center; }
  .title { font-size: 3.5rem; font-weight: 900; margin: 0; background: linear-gradient(to right, #ff4b1f, #ff9068); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .lobby-container { width: 100%; max-width: 800px; margin-top: 40px; background: #11151c; border: 1px solid #2d3748; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .lobby-header { display: flex; justify-content: space-between; align-items: center; background: #1a202c; padding: 20px; border-bottom: 1px solid #2d3748; }
  .lobby-title { font-size: 1.2rem; font-weight: bold; }
  .btn-create { background: linear-gradient(135deg, #ff4b1f, #ff6b35); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .btn-create:hover { transform: scale(1.05); }
  .room-list { display: flex; flex-direction: column; max-height: 500px; overflow-y: auto; }
  .room-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #2d3748; transition: 0.2s; }
  .room-item:hover { background: #1a202c; }
  .room-info { display: flex; flex-direction: column; gap: 4px; }
  .room-name { font-size: 1.1rem; font-weight: bold; color: #fff; }
  .room-status { font-size: 0.85rem; color: #a0aec0; }
  .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
  .badge-wait { background: #238636; color: white; }
  .badge-full { background: #c53030; color: white; }
  .btn-join { background: #2b6cb0; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  .btn-join:hover { background: #3182ce; }
  .btn-join:disabled { background: #4a5568; cursor: not-allowed; }
  .empty-msg { text-align: center; padding: 40px; color: #718096; }
</style>
</head>
<body>
<div class="header">
  <h1 class="title">CHAOS OMOK</h1>
  <div style="color: #a0aec0; margin-top: 10px;">멀티플레이 실시간 로비</div>
</div>
<div class="lobby-container">
  <div class="lobby-header">
    <div class="lobby-title">대기 중인 방 목록</div>
    <button class="btn-create" onclick="openCreatePrompt()">+ 새 방 만들기</button>
  </div>
  <div class="room-list" id="room-list"><div class="empty-msg">서버에 연결 중입니다...</div></div>
</div>
<script>
  const socket = io();
  const roomListEl = document.getElementById('room-list');
  
  function openCreatePrompt() {
    const roomName = prompt("방 제목을 입력하세요:", "카오스 한 판 붙자");
    if (roomName !== null) socket.emit('createRoom', roomName.trim() || '이름 없는 방');
  }
  
  socket.on('roomCreated', (roomId) => { window.location.href = `/game.html?room=${roomId}`; });
  
  socket.on('roomList', (rooms) => {
    roomListEl.innerHTML = '';
    if (rooms.length === 0) return roomListEl.innerHTML = '<div class="empty-msg">현재 열려있는 방이 없습니다. 새 방을 만들어보세요!</div>';
    
    rooms.forEach(room => {
      const isFull = room.players >= 2;
      const statusClass = isFull ? 'badge-full' : 'badge-wait';
      // [수정] 1/2 로 고정되어 있던 하드코딩 제거하고 실제 room.players 값으로 변경
      const statusText = isFull ? '게임 중 (2/2)' : `대기 중 (${room.players}/2)`; 
      const btnState = isFull ? 'disabled' : '';
      
      roomListEl.insertAdjacentHTML('beforeend', `
        <div class="room-item">
          <div class="room-info">
            <div class="room-name">${room.name}</div>
            <div class="room-status">
              <span class="status-badge ${statusClass}">${statusText}</span>&nbsp; 코드: ${room.id}
            </div>
          </div>
          <button class="btn-join" ${btnState} onclick="joinRoom('${room.id}')">${isFull ? '입장 불가' : '입장하기'}</button>
        </div>
      `);
    });
  });
  
  function joinRoom(roomId) { window.location.href = `/game.html?room=${roomId}`; }
</script>
</body>
</html>
